[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "modelhog"
version = "0.1.0"
description = "Find the AI models (Hugging Face, Ollama, LM Studio…) and developer caches eating your disk, and delete them safely."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arka Khorchidian" }]
requires-python = ">=3.9"
dependencies = ["rich>=13"]
keywords = ["disk-space", "huggingface", "ollama", "lm-studio", "cache", "cleanup", "llm", "developer-tools", "node-modules", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
modelhog = "modelhog.cli:main"

[project.urls]
Homepage = "https://github.com/ArkaKhorchidian/modelhog"
Issues = "https://github.com/ArkaKhorchidian/modelhog/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/modelhog"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
